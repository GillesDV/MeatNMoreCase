services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: retaildemo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  article-service:
    build:
      context: .
      dockerfile: ArticleService/ArticleService.Api/Dockerfile
    container_name: retaildemo-article-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ArticleDb: "Server=sqlserver,1433;Database=ArticleDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Firebase__ProjectId: "${FIREBASE_PROJECT_ID}"
      Firebase__ServiceAccountKeyPath: "${FIREBASE_SERVICE_ACCOUNT_KEY_PATH}"
    depends_on:
      - sqlserver

volumes:
  sqlserver-data:
